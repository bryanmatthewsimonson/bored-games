name: Deploy web app to GitHub Pages

# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Deploys only after CI (ci.yml, `pnpm check`) has passed on a push to main, and builds the commit CI checked.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vite.config.ts sets base: './', so the build works under https://<owner>.github.io/<repo>/.
      # The licensed names stay off the public site until licensed (D046): the flag is off explicitly (a process
      # variable wins over any .env file), and the scan fails the job before anything is uploaded, on a manual
      # dispatch too.
      - env:
          VITE_LICENSED_BRANDS: '0'
        run: pnpm build:web
      - run: pnpm scan:dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
